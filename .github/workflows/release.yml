name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Run checks
        run: ./test.sh

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh --no-install

      - name: Package
        working-directory: .build
        run: |
          zip="SamsungScan-$VERSION.zip"
          ditto -c -k --keepParent "Samsung Scan.app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "SHA256=$(cut -d ' ' -f 1 "$zip.sha256")" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            ".build/SamsungScan-$VERSION.zip" \
            ".build/SamsungScan-$VERSION.zip.sha256" \
            --title "Samsung Scan $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$TAP_DEPLOY_KEY"
          git clone git@github.com:michaelheichler/homebrew-tap.git tap
          cask=tap/Casks/samsung-scan.rb
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            "$cask"
          git -C tap \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "samsung-scan $VERSION"
          git -C tap push
